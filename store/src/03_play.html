<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="store.css">
<style>
body { background: radial-gradient(1000px 800px at 50% 30%, #3B5BEA, var(--accent) 60%, var(--accent-dk)); }
.txt { position: absolute; left: 80px; right: 80px; top: 120px; color: #fff; }
.txt .h { color: #fff; }
.txt .sub { color: rgba(255,255,255,.82); margin-top: 30px; }
.keys { left: -30px; right: -30px; bottom: 0; height: 300px; gap: 8px; }
.keys .w { border-radius: 0 0 16px 16px; box-shadow: inset 0 -12px 0 rgba(0,0,0,.08), 0 20px 40px rgba(0,0,0,.2); }
.keys .on-key { background: #C9D4FF !important; box-shadow: 0 0 60px 14px rgba(255,255,255,.65) !important; }
.keys .b.on-key { background: #fff !important; }
.phone { --w: 560px; left: 260px; top: 640px; z-index: 5; box-shadow: inset 0 0 0 2px #3a3e47, inset 0 0 0 5px #08090b, 0 60px 120px rgba(8, 14, 60, .55); }
</style></head><body>
<div class="txt">
  <div class="h">Plays with a real<br>grand piano sound.</div>
  <div class="sub">A line marks the note you hear. The keyboard shows which keys sound.</div>
</div>
<div class="keys" data-n="15" data-start="0" data-on="w1,b2,w13"></div>
<div class="phone" data-shot="img/play.png"></div>
<script src="store.js"></script></body></html>
